name: Diagnostico Actions Publico

on:
  push:
    paths:
      - 'diagnostic-trigger.txt'
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Testar runner
        run: echo "PUBLIC_ACTIONS_OK"
