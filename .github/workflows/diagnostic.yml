name: Diagnostico Actions Publico

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Validar runner publico
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_ACTIONS_OK"
