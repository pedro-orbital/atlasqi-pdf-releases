name: Diagnostico Actions Publico

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  fetch-current-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar pacote Beta atual
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://github.com/pedro-orbital/atlasqi-pdf-releases/releases/download/v0.9.3/AtlasQI_PDF_Update_v0.9.3.zip' \
            -o AtlasQI_PDF_Update_v0.9.3.zip
          sha256sum AtlasQI_PDF_Update_v0.9.3.zip
      - name: Disponibilizar pacote para diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: atlasqi-pdf-v093-base
          path: AtlasQI_PDF_Update_v0.9.3.zip
          retention-days: 1
